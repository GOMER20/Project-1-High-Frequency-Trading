# HFT Strategy: every setting, in one file.
#
#   hftbt run      --config backtest/hft_strategy.ini
#   hftbt validate --config backtest/hft_strategy.ini --out reports
#
# Any setting can be changed for one run without editing this file:
#   --set strategy.enter_score=0.6
#
# A name the program does not know stops it, so a typo cannot quietly turn a
# limit off. Prices are in cents (a tick is one cent); money is in dollars.

[market]
# Gomer Trading's practice market, generated exactly as the app makes it.
seed = 1
sessions = 1
# Which listings to trade: "all" for every one of the practice market's 34,
# or a list. The strategy picks its own from these as it goes, by volatility.
symbols = all
# Our own trades move prices, as they do in the app.
impact = true
# Ticks a session: half a second each, so 46800 is 9:30 to 16:00.
ticks_per_session = 46800
# Or replay a tick file instead (from `hftbt generate` or `hftbt import-hft`):
# ticks = data/session.lobt

[exchange]
# Delays, in microseconds: market data to the strategy, its orders and its
# cancels to the book.
feed_latency_us = 1000
order_latency_us = 1000
cancel_latency_us = 1000
# Dollars a share on every share traded. Gomer Trading competitions default to
# none; 0.005 is a typical rate.
commission_per_share = 0
# What happens to our place in the queue when the size shown at our price
# shrinks without a trade: prorata (some of it was ahead of us), back (none
# of it was: pessimistic), front (all of it was: optimistic), or hft: as
# HFT's house does it in Gomer Trading's realistic sandbox, where whole
# orders go, newest first, and what is then short comes back behind us.
queue = hft
# Whether trade prints are other traders' orders that trade with the queue.
# In Gomer Trading's realistic sandbox, where HFT decides the fills, they are:
# true. In standard competitions they are decoration and only a price moving
# through a resting order fills it: false.
print_fills = true
# Levels of the market's own liquidity a side (1 to 10).
depth_levels = 10

[strategy]
# --- Signals ---
# Levels a side in the order-book imbalance (1 to 5).
obi_levels = 5
# Trades in the trade-flow and toxicity window.
flow_window = 50
# How fast the trend forgets, in milliseconds.
trend_halflife_ms = 5000
# How fast the volatility measure forgets, in milliseconds.
vol_halflife_ms = 60000
# Weights of each signal in the score.
w_obi = 1.0
w_micro = 1.0
w_flow = 0.5
w_trend = 0.0

# --- Entry ---
# Which side to join: "queue" joins the side with less ahead in the queue,
# the quicker to fill, unless the score is at least enter_score against it;
# "score" joins the bid when the score is at least enter_score and the offer
# when it is at most minus that.
entry_side = queue
enter_score = 1.0
# Withdraw a waiting entry once the score for its side falls below this.
cancel_score = -1.0
# Do not enter when trade flow is more one-sided than this (0 to 1).
max_toxicity = 0.6
# Only enter when the mid has been moving at most this many ticks a second
# (0: any). A one-tick spread pays only if the price moves slowly compared
# with how fast the queue fills; in the practice market that means the
# cheapest listings, a cent being a large part of their moves.
max_volatility = 0.5
# Only enter when the spread is in this range, in ticks.
min_spread_ticks = 1
max_spread_ticks = 3
order_size = 100
# Withdraw an entry that has waited this long, in milliseconds.
entry_timeout_ms = 30000

# --- Exit ---
# Take profit this many ticks from the entry.
target_ticks = 1
# Get out at the market if the target has not been reached in this long.
time_stop_ms = 30000
# Get out at once if the score turns this far against the position (0: never).
scratch_score = 0
# If the market moves this many ticks against the position, offer it out at
# the entry price instead, to scratch it (0: never).
breakeven_ticks = 2
# If the market moves this many ticks against the position, get out at once
# (0: never).
stop_ticks = 0

# --- Risk ---
# Shares, per symbol and in all.
max_position = 200
max_total_position = 2000
# Kill switch: stop and get out of everything after losing this much in a
# session, or in the whole run.
max_session_loss = 500
max_run_loss = 2000
max_orders_per_second = 20

# --- Baseline ---
# Enter on a coin toss instead of the signals, every other rule the same.
random_entries = false
# With random_entries: keep the volatility and toxicity filters, toss only for the side.
random_filters = false
random_seed = 1

[validation]
# The market above, as one stream of sessions + holdout_sessions days.
sessions = 20
train_sessions = 4
test_sessions = 2
holdout_sessions = 6
# Settings tried while tuning: every combination.
grid = strategy.max_volatility=0.3|0.4|0.5, strategy.time_stop_ms=30000|60000, strategy.breakeven_ticks=0|2
# 0: one per core.
threads = 0
