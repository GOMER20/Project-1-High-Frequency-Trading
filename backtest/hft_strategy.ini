# HFT Strategy: every setting, in one file.
#
#   hftbt run      --config backtest/hft_strategy.ini
#   hftbt validate --config backtest/hft_strategy.ini --out reports
#
# Any setting can be changed for one run without editing this file:
#   --set strategy.enter_score=0.6
#
# A name the program does not know stops it, so a typo cannot quietly turn a
# limit off. Prices are in cents (a tick is one cent); money is in dollars.

[market]
# Gomer Trading's practice market, generated exactly as the app makes it.
seed = 1
sessions = 1
symbols = AAPL, MSFT, NVDA, TSLA, AMZN, GOOGL, META, AMD, SPY, QQQ
# Our own trades move prices, as they do in the app.
impact = true
# Ticks a session: half a second each, so 46800 is 9:30 to 16:00.
ticks_per_session = 46800
# Or replay a tick file instead (from `hftbt generate` or `hftbt import-hft`):
# ticks = data/session.lobt

[exchange]
# Delays, in microseconds: market data to the strategy, its orders and its
# cancels to the book.
feed_latency_us = 1000
order_latency_us = 1000
cancel_latency_us = 1000
# Dollars a share on every share traded. Gomer Trading competitions default to
# none; 0.005 is a typical rate.
commission_per_share = 0
# Where cancellations ahead of us come from: prorata, back (never ahead of
# us: pessimistic) or front (always ahead: optimistic).
queue = prorata
# Whether trade prints trade with resting orders. Gomer Trading's practice
# market never fills anything from its prints, so false is how the app works.
print_fills = false
# Levels of the market's own liquidity a side (1 to 10).
depth_levels = 10

[strategy]
# --- Signals ---
# Levels a side in the order-book imbalance (1 to 5).
obi_levels = 5
# Trades in the trade-flow and toxicity window.
flow_window = 50
# How fast the trend forgets, in milliseconds.
trend_halflife_ms = 5000
# Weights of each signal in the score.
w_obi = 1.0
w_micro = 1.0
w_flow = 0.5
w_trend = 0.0

# --- Entry ---
# Join the best bid when the score is at least this, the best offer when it is
# at most minus this.
enter_score = 0.5
# Withdraw a waiting entry once the score falls below this.
cancel_score = 0.1
# Do not enter when trade flow is more one-sided than this (0 to 1).
max_toxicity = 0.6
# Only enter when the spread is in this range, in ticks.
min_spread_ticks = 1
max_spread_ticks = 3
order_size = 100
# Withdraw an entry that has waited this long, in milliseconds.
entry_timeout_ms = 2000

# --- Exit ---
# Take profit this many ticks from the entry.
target_ticks = 1
# Get out at the market if the target has not been reached in this long.
time_stop_ms = 3000
# Get out at once if the score turns this far against the position.
scratch_score = 0.5

# --- Risk ---
# Shares, per symbol and in all.
max_position = 200
max_total_position = 1000
# Kill switch: stop and get out of everything after losing this much in a
# session, or in the whole run.
max_session_loss = 500
max_run_loss = 2000
max_orders_per_second = 20

# --- Baseline ---
# Enter on a coin toss instead of the signals, every other rule the same.
random_entries = false
random_seed = 1

[validation]
# The market above, as one stream of sessions + holdout_sessions days.
sessions = 20
train_sessions = 4
test_sessions = 2
holdout_sessions = 6
# Settings tried while tuning: every combination.
grid = strategy.enter_score=0.3|0.5|0.8, strategy.w_trend=0|2, strategy.time_stop_ms=1000|3000
# 0: one per core.
threads = 0
